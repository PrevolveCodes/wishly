<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <title>Gift Suggestions — Wishly</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="styles.css?v=flat-controls-1">
  <script src="theme.js?v=sync-2" defer></script>
  <script type="module" src="signout.js"></script>
  <link rel="stylesheet" href="mobile-layout.css?v=compact-1">
  <script src="mobile-sidebar.js?v=responsive-2" defer></script>
  <link rel="stylesheet" href="suggestions.css?v=discovery-1">
</head>
<body class="dashboard-page">
  <aside class="wishly-sidebar" aria-label="Wishly sidebar">
    <a class="sidebar-brand" href="./" aria-label="Wishly home"><img src="icon.png" alt=""><span>wishly<span class="brand-dot">.</span></span></a>
    <nav class="sidebar-nav" aria-label="Main navigation">
      <a class="sidebar-link" href="overview.html"><img class="sidebar-icon" src="overview_icon.png?v=sidebar-icons-fix-4" alt=""><span>Overview</span></a><a class="sidebar-link" href="dashboard.html?view=make-list"><img class="sidebar-icon" src="make_list.png?v=sidebar-icons-fix-4" alt=""><span>Make a List</span></a><a class="sidebar-link" href="dashboard.html?view=lists"><img class="sidebar-icon" src="my_lists.png?v=sidebar-icons-fix-4" alt=""><span>My Lists</span></a><a class="sidebar-link" href="families.html"><img class="sidebar-icon" src="families.png" alt=""><span>Families</span></a><a class="sidebar-link is-active" href="suggestions.html" aria-current="page"><img class="sidebar-icon" src="gift_suggestions.png?v=sidebar-icons-fix-4" alt=""><span>Gift Suggestions</span></a><a class="sidebar-link" href="gift.html"><img class="sidebar-icon" src="view_list.png?v=sidebar-icons-fix-4" alt=""><span>View a Wishlist</span></a><button class="sidebar-link sidebar-theme-toggle" id="sidebar-theme-toggle" type="button"><img class="sidebar-icon" src="darklight_mode.png?v=sidebar-icons-fix-5" alt=""><span>Toggle dark mode</span></button>
    </nav>
    <div class="sidebar-bottom"></div>
  </aside>
  <main class="suggestions-main">
    <header class="ideas-heading">
      <h1>Gift suggestions</h1>
      <button id="favorites-filter" class="small-button" type="button" aria-pressed="false">♡ Saved ideas</button>
    </header>
    <div class="ideas-search"><label>Search ideas<input id="idea-search" type="search" placeholder="e.g. headphones, drawing"></label></div>
    <details class="idea-filters">
      <summary>Filter and sort</summary>
      <div class="idea-filter-fields"><label>Category<select id="category-filter"><option value="All">All categories</option><option>Tech</option><option>Books</option><option>Games</option><option>Art & Crafts</option><option>Room</option><option>Clothing</option><option>Sports</option><option>Everyday</option></select></label><label>Budget<select id="budget-filter"><option value="all">Any budget</option><option value="low">Under $15</option><option value="mid">$15–$50</option><option value="high">$50+</option></select></label><label>Sort by<select id="idea-sort"><option value="recommended">Recommended</option><option value="name">Name A–Z</option><option value="budget-low">Budget: low to high</option><option value="budget-high">Budget: high to low</option><option value="category">Category</option></select></label></div>
    </details>
    <section aria-label="Gift ideas"><div class="suggestions-tools"><p id="suggestions-count" class="suggestions-count" aria-live="polite"></p><button id="reset-filters" class="small-button" type="button" hidden>Reset filters</button></div><div id="suggestions-grid" class="suggestions-grid"></div><p id="suggestions-empty" class="suggestions-empty" hidden>No ideas match those filters. Try changing the category, budget, or search.</p></section>
  </main>
  <dialog id="add-to-list-dialog" class="suggestion-modal" aria-labelledby="add-to-list-title"><div class="suggestion-modal-inner"><h2 id="add-to-list-title">Which list?</h2><p id="add-to-list-description">Choose which wishlist should get this gift idea.</p><div id="suggestion-list-options" class="suggestion-list-options"></div><div class="suggestion-modal-actions"><button id="close-add-to-list" class="modal-close" type="button">Cancel</button></div></div></dialog>
  <script type="module" src="suggestions.js?v=discovery-1"></script>
  <script>document.addEventListener("click",function(event){const link=event.target.closest(".sidebar-nav a.sidebar-link");if(link&&link.href)sessionStorage.setItem("wishly-sidebar-navigation","1");});</script>
  <script src="seasonal-theme.js?v=winter-1" defer></script>
</body>
</html>
