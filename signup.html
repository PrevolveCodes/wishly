<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
    <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6f2">
  <meta name="description" content="Create a Wishly account or sign in to manage your wishlists.">
  <title>Sign up or sign in — Wishly</title>
  <link rel="stylesheet" href="styles.css?v=visual-pass-1">
  <script src="theme.js" defer></script>
  <script type="module" src="signup.js"></script>
</head>
<body class="signup-page">
  <header class="topbar">
    <a class="brand" href="./" aria-label="Wishly home"><img class="brand-mark" src="icon.png" alt=""><span>wishly<span class="brand-dot">.</span></span></a>
    <nav class="top-nav" aria-label="Main navigation"><a href="./">Home</a><a href="./#about">About</a></nav>
  </header>
  <main class="signup-main">
    <a class="back-link" href="./">← Back to Wishly</a>
    <section class="signup-card">
      <div class="signup-intro">
        <div class="card-icon lavender"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></div>
        <div class="eyebrow">YOUR WISHES, ALL IN ONE PLACE</div>
        <h1 id="signup-heading">Make your account<span>.</span></h1>
        <p id="signup-description">Create an account to build and manage your wishlists.</p>
      </div>
      <form id="account-form" class="signup-form">
        <label for="account-email">Email</label>
        <input id="account-email" type="email" autocomplete="email" required maxlength="254" placeholder="you@example.com">
        <label for="account-password">Password</label>
        <input id="account-password" type="password" autocomplete="new-password" minlength="6" required>
        <button class="button button-primary" id="account-submit" type="submit">Create account <span>→</span></button>
        <div class="signup-divider"><span>or</span></div>
        <button class="button google-button" id="google-sign-in" type="button"><img class="google-logo" src="google.png?v=signup-google-icon-1" alt="" aria-hidden="true"> Continue with Google</button>
        <button class="small-button signup-toggle" id="account-toggle" type="button">Already have an account? Sign in</button>
      </form>
      <p id="account-status" class="signup-status" role="status">You can use email and password or Google.</p>
    </section>
  </main>
  <p id="notice" class="notice hidden" role="status"></p>
  <footer><a class="brand footer-brand" href="./"><img class="brand-mark" src="icon.png" alt=""><span>wishly<span class="brand-dot">.</span></span></a><span>Thoughtful gifting, made simple.</span></footer>
</body>
</html>
